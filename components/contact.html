<!-- Component: Contáctenos eMCi labs -->
<section id="contact" class="contact-section">
  <div class="container">
    <div class="contact-wrapper">
      
      <!-- Left: Contact Details & Info -->
      <div class="contact-info">
        <div class="contact-info-header">
          <div class="badge-pill">
            <span class="badge-dot"></span>
            Canal Directo
          </div>
          <h2>Hablemos de tu Próximo Proyecto</h2>
          <p>¿Tienes una idea innovadora o un reto tecnológico? Cuéntanos tu visión y te responderemos con una propuesta técnica y estratégica clara.</p>
        </div>

        <div class="contact-details">
          <div class="contact-detail-item" style="padding: 1rem 1.4rem; background: #ffffff; border: 1px solid rgba(13, 91, 199, 0.15); box-shadow: 0 4px 15px rgba(0,0,0,0.04); display: flex; align-items: center; justify-content: flex-start; border-radius: var(--radius-md);">
            <img src="assets/images/logo-tight.png" alt="eMCi labs" style="height: 38px; width: auto; display: block;">
          </div>

          <div class="contact-detail-item">
            <div class="contact-detail-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </div>
            <div class="contact-detail-content">
              <div class="label">Tiempo de Respuesta</div>
              <div class="value">Menos de 24 horas hábiles</div>
            </div>
          </div>
        </div>

        <div class="footer-badge">
          <span class="badge-dot"></span>
          eMCi labs • Confidencialidad y NDA garantizados
        </div>
      </div>

      <!-- Right: Single Message Registration Form -->
      <div class="contact-form-card">
        <form id="contactForm" class="contact-form">
          <div class="form-group">
            <label for="nombre">Nombre completo o Empresa</label>
            <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Ej: Camilo Matiz o Tech Corp" required>
          </div>

          <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="tu@correo.com" required>
          </div>

          <div class="form-group">
            <label for="mensaje">¿En qué podemos ayudarte?</label>
            <textarea id="mensaje" name="mensaje" class="form-control" placeholder="Describe brevemente los requerimientos de tu proyecto o idea..." required></textarea>
          </div>

          <button type="submit" class="btn-submit">
            Enviar Mensaje
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>

          <div id="formStatus" class="form-status" role="alert"></div>
        </form>
      </div>

    </div>
  </div>
</section>
